<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17181b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg">
  <title>Account</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/skins.js"></script>
</head>
<body>
  <main class="app">
    <a class="icon-btn back-btn" href="./" aria-label="Back" id="back"></a>

    <section class="profile-top">
      <label class="big-avatar" aria-label="Change profile picture">
        <span class="avatar-img" id="bigAvatar"></span>
        <span class="avatar-badge" id="avatarBadge"></span>
        <input type="file" accept="image/*" id="avatarFile">
      </label>
      <button class="pname" id="pname"></button>
      <button class="link-btn" id="removeAvatar" hidden>Remove photo</button>
    </section>

    <div class="section-label">Vehicles</div>
    <div class="group" id="vehicles"></div>

    <div class="section-label">Customize</div>
    <div class="group">
      <button class="row" id="themesRow">
        <span class="ico" id="themesIco"></span>
        <div class="txt">
          <div class="t"><span>Themes</span></div>
          <div class="s" id="themesSub">Custom gradient</div>
        </div>
        <span class="chev" id="themesChev"></span>
      </button>
    </div>

    <div class="section-label">Account</div>
    <div class="group" id="extras"></div>

    <div class="group">
      <button class="row danger" id="signout"><div class="txt"><div class="t"><span>Sign Out</span></div></div></button>
      <button class="row danger" id="reset"><div class="txt"><div class="t"><span>Reset All Data</span></div></div></button>
    </div>
  </main>

  <div class="sheet-backdrop" id="backdrop"></div>
  <section class="sheet" id="sheet" aria-modal="true" role="dialog">
    <div class="sheet-head">
      <button class="cancel" id="cancel">Cancel</button>
      <h2 id="sheetTitle">Add Vehicle</h2>
      <span></span>
    </div>
    <form class="sheet-body" id="form" autocomplete="off">
      <label class="photo-drop" id="drop">
        <div class="hint" id="dropHint"></div>
        <span class="change">Change photo</span>
        <input type="file" accept="image/*" id="photo">
      </label>

      <div class="field-label">Brand<span class="req">*</span></div>
      <div class="brand-grid" id="brands"></div>

      <div class="field-label">Powertrain</div>
      <div class="segmented" id="powertrain">
        <button type="button" data-v="electric">Electric</button>
        <button type="button" data-v="gas">Gas</button>
      </div>

      <div class="field-label">Body Type<span class="req">*</span></div>
      <div class="chips" id="bodyType"></div>

      <div class="field-label">Name<span class="req">*</span></div>
      <input class="input" id="title" maxlength="40" placeholder="e.g. Black Edition">

      <div class="field-label">Description</div>
      <textarea class="input" id="desc" maxlength="140" placeholder="e.g. S-Class S 580 · Obsidian Black"></textarea>

      <div class="field-label">Location<span class="req">*</span></div>
      <input class="input with-suggest" id="location" maxlength="80" placeholder="Where is it parked?">
      <button type="button" class="suggest" id="suggestLoc"></button>

      <div class="form-error" id="formError"></div>
      <button class="btn" type="submit" id="save">Save</button>
      <button class="btn ghost-danger" type="button" id="remove" hidden>Remove Vehicle</button>
    </form>
  </section>

  <div class="theme-backdrop" id="themeBackdrop"></div>
  <section class="theme-sheet" id="themeSheet" aria-modal="true" role="dialog" aria-label="Themes">
    <div class="sheet-head">
      <button class="cancel" id="themeClose">Cancel</button>
      <h2>Themes</h2>
      <span></span>
    </div>
    <div class="theme-body">
      <div class="preview-wrap">
        <div class="mini-frame preview-frame" id="themePreviewFrame">
          <div class="mini" id="themePreview"></div>
        </div>
      </div>

      <div class="color-targets" role="group" aria-label="Choose which gradient color to edit">
        <button type="button" class="color-target active" data-target="primary" aria-pressed="true">
          <span class="target-swatch" id="primaryDot"></span>
          <span class="target-text">
            <span class="target-label">Primary</span>
            <span class="target-hex" id="primaryHex">#1F3A68</span>
          </span>
        </button>
        <button type="button" class="color-target" data-target="secondary" aria-pressed="false">
          <span class="target-swatch" id="secondaryDot"></span>
          <span class="target-text">
            <span class="target-label">Secondary</span>
            <span class="target-hex" id="secondaryHex">#C6A664</span>
          </span>
        </button>
      </div>

      <div class="palette-head" id="paletteHead">
        <span class="palette-title" id="paletteTitle">Primary palette</span>
        <span class="palette-note" id="paletteNote">Sapphire</span>
      </div>
      <div class="palette" id="palette" role="group" aria-labelledby="paletteTitle">
        <button type="button" class="swatch swatch-custom" id="customSwatch" title="Custom color" aria-label="Open custom color picker" aria-controls="customPicker" aria-expanded="false">
          <span class="custom-ico" id="customIco"></span>
        </button>
      </div>
      <p class="theme-hint" id="themeHint">Pick a suggested color, or open the custom picker.</p>
      <section class="custom-picker" id="customPicker" hidden aria-labelledby="pickerTitle">
        <div class="picker-head">
          <span class="picker-title" id="pickerTitle">Custom primary</span>
          <button type="button" class="picker-done" id="pickerDone">Done</button>
        </div>
        <div class="picker-sv" id="svArea" tabindex="0" aria-label="Saturation and brightness">
          <div class="picker-sv-handle" id="svHandle"></div>
        </div>
        <div class="picker-hue" id="hueBar" tabindex="0" aria-label="Hue">
          <div class="picker-hue-handle" id="hueHandle"></div>
        </div>
        <div class="picker-foot">
          <span class="picker-preview" id="pickerPreview"></span>
          <label class="picker-hex-label" for="hexInput">HEX</label>
          <input class="picker-hex" id="hexInput" maxlength="7" autocomplete="off" spellcheck="false">
        </div>
      </section>
    </div>
    <div class="theme-foot">
      <div class="gradient-strip" id="gradientStrip"></div>
      <button class="btn" id="applyTheme">Apply Gradient</button>
    </div>
  </section>

  <script src="js/db.js"></script>
  <script src="js/brands.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/cropper.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
