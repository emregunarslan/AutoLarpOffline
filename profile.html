<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17181b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg">
  <title>Account</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <a class="icon-btn back-btn" href="index.html" aria-label="Back" id="back"></a>

    <section class="profile-top">
      <div class="big-avatar" id="bigAvatar"></div>
      <button class="pname" id="pname"></button>
      <div class="since" id="since"></div>
    </section>

    <div class="section-label">Vehicles</div>
    <div class="group" id="vehicles"></div>

    <div class="section-label">Account</div>
    <div class="group" id="extras"></div>
  </main>

  <div class="sheet-backdrop" id="backdrop"></div>
  <section class="sheet" id="sheet" aria-modal="true" role="dialog">
    <div class="sheet-head">
      <button class="cancel" id="cancel">Cancel</button>
      <h2 id="sheetTitle">Add Vehicle</h2>
      <span></span>
    </div>
    <form class="sheet-body" id="form" autocomplete="off">
      <label class="photo-drop" id="drop">
        <div class="hint" id="dropHint"></div>
        <span class="change">Change photo</span>
        <input type="file" accept="image/*" id="photo">
      </label>

      <div class="field-label">Brand</div>
      <div class="brand-grid" id="brands"></div>

      <div class="field-label">Powertrain</div>
      <div class="segmented" id="powertrain">
        <button type="button" data-v="electric">Electric</button>
        <button type="button" data-v="gas">Gas</button>
        <button type="button" data-v="hybrid">Hybrid</button>
      </div>

      <div class="field-label">Name</div>
      <input class="input" id="title" maxlength="40" placeholder="e.g. Midnight">

      <div class="field-label">Description</div>
      <textarea class="input" id="desc" maxlength="140" placeholder="e.g. Model S Plaid · Ultra Red"></textarea>

      <div class="field-label">Location</div>
      <input class="input" id="location" maxlength="60" placeholder="e.g. 15 Greyhawk St">


      <button class="btn" type="submit" id="save" disabled>Save</button>
      <button class="btn ghost-danger" type="button" id="remove" hidden>Remove Vehicle</button>
    </form>
  </section>

  <script src="js/db.js"></script>
  <script src="js/brands.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
